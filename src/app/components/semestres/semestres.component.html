<table class="table table-striped table-bordered table-hover">
    <thead class="thead-dark text-center">
        <tr>
            <th scope="col" style="width: 10%;">ID</th>
            <th scope="col" style="width: 20%;">Nombre</th>
            <th scope="col" style="width: 30%;">Accion</th>
        </tr>
    </thead>
    <tbody class="text-center">
        <tr *ngFor="let semestre of semestres">
            <th scope="row" class="align-middle">{{ semestre.id_semestre }}</th>
            <td class="align-middle">{{ semestre.nombre }}</td>
            <td class="align-middle">
                <button class="btn btn-danger" type="button" (click)="borrarSemestre( semestre.id_semestre )">Borrar</button>
            </td>
        </tr>
    </tbody>
</table>
<div class="container-fluid">
    <button type="button" class="btn btn-outline-success btn-block" data-toggle="modal" data-target="#modalSemestre">
        + Crear un nuevo semestre
    </button>
</div>

<div class="modal fade" id="modalSemestre" tabindex="-1" role="dialog" aria-labelledby="modalSemestreLabel" style="overflow-y: visible;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCasaLabel">Crear semestre</h5>
                <button #cerrar type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form [formGroup]="enviarForm" (ngSubmit)="agregarSemestre()">
                    <div class="form-row mb-3">
                        <div class="col-md-12">
                            <label for="nombre">Nombre de semestre: <small class="text-danger">*</small></label>
                            <input type="text" class="form-control" placeholder="Ingrese el nombre" formControlName="nombre" >
                            <small *ngIf="validacionNombre" class="form-text text-danger">Ingrese un nombre válido.</small>
                        </div>
                    </div>
                    <div>
                        <div class="form-row mb-3">
                            <label for="inicio">Inicio de semestre: <small class="text-danger">*</small></label>
                            <input type="date" class="form-control" id="inicio" placeholder="Ingrese la fecha de inicio" formControlName="inicio" [class.is-invalid]="validacionFechaInicio">
                            <small *ngIf="validacionFechaInicio" class="form-text text-danger">Fecha de inicio Obligatoria.</small>
                        </div>
        
                        <div class="form-row mb-3">
                                <label for="fin">Fin de semestre: <small class="text-danger">*</small></label>
                                <input type="date" class="form-control" id="fin" placeholder="Ingrese la fecha de fin" formControlName="fin" [class.is-invalid]="validacionFechaCierre">
                                <small *ngIf="validacionFechaCierre" class="form-text text-danger">Fecha de fin Obligatoria.</small>
                        </div>
                        <small *ngIf="compararFechas()" class="form-text text-danger text-center ml-1">Fechas no válidas. {{ mensajeError }}</small>
                    </div>
                    <div class="buttonDiv">
                        <button class="btn btn-success botonPagar" [disabled]="enviarForm.invalid" type="submit">Crear</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
