<table class="table table-striped table-bordered table-hover">
    <thead class="thead-dark text-center">
        <tr>
            <th scope="col" style="width: 10%;">ID</th>
            <th scope="col" style="width: 20%;">Nombre</th>
            <th scope="col" style="width: 30%;">Accion</th>
        </tr>
    </thead>
    <tbody class="text-center">
        <tr *ngFor="let semestre of semestres">
            <th scope="row" class="align-middle">{{ semestre.id_semestre }}</th>
            <td class="align-middle">{{ semestre.nombre }}</td>
            <td class="align-middle">
                <button class="btn btn-danger" type="button" (click)="borrarSemestre( semestre.id_semestre )">Borrar</button>
            </td>
        </tr>
    </tbody>
</table>
<div class="container-fluid">
    <button type="button" class="btn btn-outline-success btn-block" data-toggle="modal" data-target="#modalSemestre">
        + Crear una nuevo semestre
    </button>
</div>

<div class="modal fade" id="modalSemestre" tabindex="-1" role="dialog" aria-labelledby="modalSemestreLabel" style="overflow-y: visible;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalCasaLabel">Crear semestre</h5>
                <button #cerrar type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p>olis</p>
            </div>
        </div>
    </div>
</div>
